[tools]
go = "1.26"
goreleaser = "latest"
golangci-lint = "latest"

[tasks.build]
description = "Build the hauth binary"
run = "go build -o hauth ./cmd/hauth"

[tasks.test]
description = "Run all tests with the race detector"
run = "go test -race ./..."

[tasks.fmt]
description = "Format Go sources"
run = "gofmt -w ."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.snapshot]
description = "Build a local release snapshot without publishing"
run = "goreleaser release --snapshot --clean --skip=publish"

[tasks.docker]
description = "Build the runtime image"
run = "docker build -f deploy/docker/Dockerfile -t hauth:dev ."

[tasks.docker-hapi]
description = "Build the HAPI workspace image"
run = "docker build -f deploy/docker/Dockerfile.hapi -t hauth-hapi:dev ."
